[ElectricCabinetSerialPort]
Enabled=true
PortName=COM1
BaudRate=115200
DataBits=Data8
Parity=NoParity
StopBits=OneStop
FlowControl=NoFlowControl
AutoReconnect=true
ReconnectIntervalMs=3000
CommandTimeoutMs=1000
InterFrameTimeoutMs=30

[ElectricCabinetPropertyMonitor]
Enabled=true
PollIntervalMs=1000
RetryIntervalMs=3000
RequestFrameHex=02 03 00 00 33 33 33

[ElectricCabinetTempHumi]
TempMax=60
HumiMax=80
CommandResponseTimeoutMs=1500

[ElectricCabinetSwitchControl]
CommandResponseTimeoutMs=1500
